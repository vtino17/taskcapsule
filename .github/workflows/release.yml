name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build artifacts without publishing'
        required: true
        default: 'true'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate tag or branch
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag format: $VERSION"; exit 1; }
          fi
          test -f LICENSE || { echo "LICENSE file missing"; exit 1; }
          test -f README.md || { echo "README.md file missing"; exit 1; }

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -timeout 15m

      - name: Race test
        run: go test -race ./... -timeout 20m

      - name: Integration test
        run: go test -tags=integration ./test/integration/... -timeout 20m

      - name: Build all
        run: go build ./...

      - name: Verify module
        run: go mod verify

  build:
    needs: [validate-and-test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build and package all targets
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          export SOURCE_DATE_EPOCH
          VERSION="${GITHUB_REF_NAME#v}" \
          COMMIT="$GITHUB_SHA" \
          BUILD_DATE="$(date -u -d "@$SOURCE_DATE_EPOCH" +%Y-%m-%d)" \
          bash scripts/verify-reproducible-release.sh ./dist

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: taskcapsule-${{ github.ref_name }}.cdx.json
          output-file: dist/taskcapsule-${{ github.ref_name }}.cdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error

  release:
    needs: [validate-and-test, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      artifact-metadata: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > checksums.txt
          ls -la

      - name: Attest archives and SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
          sbom-path: artifacts/taskcapsule-${{ github.ref_name }}.cdx.json

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/*.tar.gz artifacts/*.zip artifacts/checksums.txt artifacts/*.cdx.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "TaskCapsule $GITHUB_REF_NAME" \
            --notes "See the [CHANGELOG](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md) for details." \
            --verify-tag \
            --latest

  release-dry-run:
    needs: [validate-and-test]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Package all targets
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          export SOURCE_DATE_EPOCH
          VERSION=0.0.0-dry-run \
          COMMIT=DRY-RUN \
          BUILD_DATE=$(date -u -d "@$SOURCE_DATE_EPOCH" +%Y-%m-%d) \
          bash scripts/verify-reproducible-release.sh ./dist

      - name: Verify all 5 archives exist
        run: |
          set -e
          cd dist
          for f in \
            taskcapsule_0.0.0-dry-run_linux_amd64.tar.gz \
            taskcapsule_0.0.0-dry-run_linux_arm64.tar.gz \
            taskcapsule_0.0.0-dry-run_darwin_amd64.tar.gz \
            taskcapsule_0.0.0-dry-run_darwin_arm64.tar.gz \
            taskcapsule_0.0.0-dry-run_windows_amd64.zip; do
            test -f "$f" || { echo "Missing: $f"; exit 1; }
            echo "Found: $f"
          done
          echo "All 5 archives present"

      - name: Verify Linux amd64 archive contents
        run: |
          set -euo pipefail
          cd dist
          tar tzf taskcapsule_0.0.0-dry-run_linux_amd64.tar.gz | grep -E "(^|/)LICENSE" > /dev/null || { echo "LICENSE missing"; tar tzf taskcapsule_0.0.0-dry-run_linux_amd64.tar.gz | head -5; exit 1; }
          tar tzf taskcapsule_0.0.0-dry-run_linux_amd64.tar.gz | grep -E "(^|/)README" > /dev/null || { echo "README.md missing"; tar tzf taskcapsule_0.0.0-dry-run_linux_amd64.tar.gz | head -10; exit 1; }
          tar tzf taskcapsule_0.0.0-dry-run_linux_amd64.tar.gz | grep -E "(^|/)taskcapsule" > /dev/null || { echo "binary missing"; tar tzf taskcapsule_0.0.0-dry-run_linux_amd64.tar.gz | head -5; exit 1; }
          echo "Linux amd64 archive valid"

      - name: Verify Windows archive contents
        run: |
          set -euo pipefail
          cd dist
          unzip -l taskcapsule_0.0.0-dry-run_windows_amd64.zip | grep -E "(^| )LICENSE" > /dev/null || { echo "LICENSE missing"; exit 1; }
          unzip -l taskcapsule_0.0.0-dry-run_windows_amd64.zip | grep -E "(^| )README" > /dev/null || { echo "README.md missing"; exit 1; }
          unzip -l taskcapsule_0.0.0-dry-run_windows_amd64.zip | grep -E "(^| )taskcapsule" > /dev/null || { echo "taskcapsule.exe missing"; exit 1; }
          echo "Windows archive valid"

      - name: Verify checksums
        run: |
          set -euo pipefail
          cd dist
          test -f checksums.txt || { echo "checksums.txt missing"; exit 1; }
          sha256sum -c checksums.txt || { echo "checksum verification failed"; exit 1; }
          echo "All checksums valid"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run
          path: dist/*
          if-no-files-found: error
